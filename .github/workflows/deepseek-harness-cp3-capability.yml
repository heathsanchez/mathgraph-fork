name: DeepSeek Harness accepts learned CP3 capability

on:
  workflow_run:
    workflows: ["Checkpoint 3 frozen end-to-end pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Completed Checkpoint 3 frozen pipeline run id"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  accept-capability:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'triskelion-runtime-cp1')
      }}
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
      TRISKELION_REPO_ROOT: ${{ github.workspace }}
      HANDOFF_CODE_COMMIT: "613943a2cdb65a9904f9b2463185d4e45b30745c"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HANDOFF_CODE_COMMIT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert pinned handoff revision
        run: test "$(git rev-parse HEAD)" = "$HANDOFF_CODE_COMMIT"

      - name: Install Triskelion test/runtime dependencies
        run: python -m pip install -e '.[dev]'

      - name: Download learned CP3 capability from frozen pipeline
        uses: actions/download-artifact@v4
        with:
          name: cp3-pipeline-capability
          path: .triskelion/imports/cp3
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download frozen protected evaluation
        uses: actions/download-artifact@v4
        with:
          name: cp3-pipeline-protected-eval
          path: .triskelion/imports/cp3-eval
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Prove artifact is a real CP3 capability build
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.triskelion/imports/cp3')
          capability_path = root / 'CAPABILITY.json'
          summary_path = root / 'BUILD_SUMMARY.json'
          if not capability_path.is_file() or not summary_path.is_file():
              raise SystemExit('missing learned CP3 capability build files')

          capability = json.loads(capability_path.read_text())
          summary = json.loads(summary_path.read_text())
          if summary.get('capability_id') != capability.get('capability_id'):
              raise SystemExit('CP3 build summary/capability identity mismatch')
          if int(summary.get('admitted_rule_count', 0)) < 1:
              raise SystemExit('CP3 capability contains no admitted rule')
          if summary.get('build_protocol') != 'TRISKELION_BUGSINPY_CHECKPOINT3_CAPABILITY_BUILD_V1':
              raise SystemExit('unexpected capability build protocol')
          print(json.dumps({
              'capability_id': capability['capability_id'],
              'admitted_rule_count': summary['admitted_rule_count'],
              'build_protocol': summary['build_protocol'],
          }, indent=2, sort_keys=True))
          PY

      - name: Acceptance-test learned capability through Harness lifecycle
        run: |
          python integrations/deepseek-harness/accept_capability.py \
            .triskelion/imports/cp3/CAPABILITY.json

      - name: Deterministically select a causal demo case
        run: |
          mkdir -p harness-acceptance
          python integrations/deepseek-harness/select_cp3_demo_case.py \
            --rows .triskelion/imports/cp3-eval/ROWS.json \
            --results .triskelion/imports/cp3-eval/RESULTS.json \
            --capability .triskelion/imports/cp3/CAPABILITY.json \
            --out harness-acceptance/DEMO_CASE.json

      - name: Checkout pinned DeepSeek Harness
        run: |
          git clone --quiet https://github.com/deepseek-ai/deepseek-harness.git /tmp/deepseek-harness
          git -C /tmp/deepseek-harness checkout --quiet --detach 47f943859bef60e4160492346772ded9b24f765a

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm through Corepack
        run: corepack enable

      - name: Build pinned Harness and load Triskelion plugin
        working-directory: /tmp/deepseek-harness
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          mkdir -p scratch-plugin/triskelion
          cp "${GITHUB_WORKSPACE}/integrations/deepseek-harness/triskelion-plugin.ts" scratch-plugin/triskelion/triskelion-plugin.ts
          pnpm exec tsx -e "import('./scratch-plugin/triskelion/triskelion-plugin.ts').then(m => { if (m.name !== 'triskelion-runtime' || typeof m.apply !== 'function') process.exit(2); console.log('learned CP3 capability host: PASS') })"

      - name: Emit durable acceptance receipt
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          cap = Path('.triskelion/imports/cp3/CAPABILITY.json')
          payload = json.loads(cap.read_text())
          demo = json.loads(Path('harness-acceptance/DEMO_CASE.json').read_text())
          receipt = {
              'protocol': 'TRISKELION_DEEPSEEK_HARNESS_CP3_ACCEPTANCE_V1',
              'source_pipeline_run_id': os.environ['SOURCE_RUN_ID'],
              'handoff_code_commit': os.environ['HANDOFF_CODE_COMMIT'],
              'capability_id': payload['capability_id'],
              'capability_file_sha256': hashlib.sha256(cap.read_bytes()).hexdigest(),
              'harness_commit': '47f943859bef60e4160492346772ded9b24f765a',
              'lifecycle': ['install', 'disable', 'enable', 'uninstall'],
              'result': 'PASS',
              'demo_case': {
                  'project': demo['selected']['project'],
                  'bug_id': demo['selected']['bug_id'],
                  'frozen_case_index': demo['selected']['frozen_case_index'],
              },
              'scientific_scope': 'host/lifecycle acceptance plus deterministic visualization selection; aggregate frozen protected evaluation remains authoritative',
          }
          Path('harness-acceptance/RECEIPT.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Independently verify complete CP3 to Harness evidence chain
        run: |
          python integrations/deepseek-harness/verify_cp3_handoff.py \
            --capability .triskelion/imports/cp3/CAPABILITY.json \
            --build-summary .triskelion/imports/cp3/BUILD_SUMMARY.json \
            --rows .triskelion/imports/cp3-eval/ROWS.json \
            --results .triskelion/imports/cp3-eval/RESULTS.json \
            --demo harness-acceptance/DEMO_CASE.json \
            --receipt harness-acceptance/RECEIPT.json \
            --out harness-acceptance/VERIFICATION.json

      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-cp3-acceptance
          path: harness-acceptance
          retention-days: 90
