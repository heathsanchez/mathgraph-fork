name: Checkpoint 3 finalize qualification

on:
  workflow_run:
    workflows: ["Checkpoint 3 pandas qualification rescue"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pandas_rescue_run_id:
        description: "Completed pandas rescue workflow run ID"
        required: true
        type: string
      main_run_id:
        description: "Original qualification workflow run containing completed non-pandas shards"
        required: true
        default: "31854063331"
        type: string
      python36_run_id:
        description: "Completed Python 3.6 recovery workflow run ID"
        required: true
        default: "31853292021"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'triskelion-runtime-cp1')
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      MAIN_RUN_ID: ${{ inputs.main_run_id || '31854063331' }}
      PY36_RUN_ID: ${{ inputs.python36_run_id || '31853292021' }}
      PANDAS_RESCUE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.pandas_rescue_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download completed non-pandas shards from original frozen run
        uses: actions/download-artifact@v4
        with:
          pattern: checkpoint3-qualification-*
          path: sources/main-shards
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.MAIN_RUN_ID }}

      - name: Download reduced pandas rescue evidence
        uses: actions/download-artifact@v4
        with:
          name: checkpoint3-qualification-pandas-rescue
          path: sources/pandas
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PANDAS_RESCUE_RUN_ID }}

      - name: Download Python 3.6 ansible recovery
        uses: actions/download-artifact@v4
        with:
          name: checkpoint3-python36-ansible
          path: sources/ansible
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PY36_RUN_ID }}

      - name: Download Python 3.6 cookiecutter recovery
        uses: actions/download-artifact@v4
        with:
          name: checkpoint3-python36-cookiecutter
          path: sources/cookiecutter
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PY36_RUN_ID }}

      - name: Download Python 3.6 tqdm recovery
        uses: actions/download-artifact@v4
        with:
          name: checkpoint3-python36-tqdm
          path: sources/tqdm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PY36_RUN_ID }}

      - name: Merge qualification evidence in frozen project order
        run: |
          set -euo pipefail
          args=()
          # The original run already emitted immutable artifacts for every completed
          # non-pandas, non-Python-3.6 project. It need not reach workflow completion.
          for d in sources/main-shards/checkpoint3-qualification-*; do
            [ -d "$d" ] || continue
            base="$(basename "$d")"
            case "$base" in
              checkpoint3-qualification-pandas|checkpoint3-qualification-ansible|checkpoint3-qualification-cookiecutter|checkpoint3-qualification-tqdm|checkpoint3-qualification-all)
                continue
                ;;
            esac
            [ -f "$d/QUALIFIED_CORPUS.json" ] && args+=(--source "$d")
          done
          args+=(--source sources/pandas --source sources/ansible --source sources/cookiecutter --source sources/tqdm)
          echo "qualification source count=$(( ${#args[@]} / 2 ))"
          python triskelion_runtime/checkpoint3_merge_qualification.py \
            "${args[@]}" \
            --out finalized/checkpoint3-qualification-final

      - name: Require evidence for all frozen projects
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('finalized/checkpoint3-qualification-final/QUALIFIED_CORPUS.json').read_text())
          if data['frozen_project_count'] != 17:
              raise SystemExit(f"unexpected frozen project count: {data['frozen_project_count']}")
          if data['projects_with_evidence'] != 17 or data['projects_missing_evidence']:
              raise SystemExit(
                  f"qualification evidence incomplete: {data['projects_with_evidence']}/17; "
                  f"missing={data['projects_missing_evidence']}"
              )
          print(json.dumps({
              'frozen_project_count': data['frozen_project_count'],
              'projects_with_evidence': data['projects_with_evidence'],
              'qualified_projects': data['qualified_projects'],
              'attempt_count': data['attempt_count'],
              'infrastructure_negatives': data['infrastructure_negatives'],
              'harness_revisions': data['harness_revisions'],
          }, indent=2, sort_keys=True))
          PY

      - name: Extract allowed protected regression tests only
        run: |
          python triskelion_runtime/checkpoint3_protected_tests.py \
            --qualification finalized/checkpoint3-qualification-final/QUALIFIED_CORPUS.json \
            --out finalized/protected-tests

      - name: Freeze sanitized causal corpus
        run: |
          python triskelion_runtime/checkpoint3_freeze_causal_corpus.py \
            --qualification finalized/checkpoint3-qualification-final/QUALIFIED_CORPUS.json \
            --out finalized/causal/CHECKPOINT3_CAUSAL_CORPUS_V1.json

      - name: Validate protected gold boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from triskelion_runtime.checkpoint3_freeze_causal_corpus import PROTECTED_FORBIDDEN_FIELDS
          causal = json.loads(Path('finalized/causal/CHECKPOINT3_CAUSAL_CORPUS_V1.json').read_text())
          tests = json.loads(Path('finalized/protected-tests/MANIFEST.json').read_text())
          for case in causal['protected']:
              leaked = PROTECTED_FORBIDDEN_FIELDS.intersection(case)
              if leaked:
                  raise SystemExit(f"protected leakage: {sorted(leaked)}")
          if tests['protected_case_count'] != causal['protected_count']:
              raise SystemExit('protected test bundle/corpus count mismatch')
          if tests['fixed_production_source_materialized'] or tests['gold_patch_materialized']:
              raise SystemExit('protected test bundle crossed gold boundary')
          print(json.dumps({
              'qualified_project_count': causal['qualified_project_count'],
              'acquisition_count': causal['acquisition_count'],
              'protected_count': causal['protected_count'],
              'causal_protocol_sha256': causal['causal_protocol_sha256'],
              'protected_test_bundle_count': tests['protected_case_count'],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload finalized immutable qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint3-qualification-final
          path: finalized/checkpoint3-qualification-final
          retention-days: 90

      - name: Upload sanitized causal corpus
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint3-causal-corpus-v1
          path: finalized/causal/CHECKPOINT3_CAUSAL_CORPUS_V1.json
          retention-days: 90

      - name: Upload protected regression test-only bundle
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint3-protected-tests-v1
          path: finalized/protected-tests
          retention-days: 90
