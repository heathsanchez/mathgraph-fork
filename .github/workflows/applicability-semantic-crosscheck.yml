name: Exploratory semantic crosscheck after applicability trial
on:
  workflow_dispatch:
  push:
    branches: [research/applicability-transfer-20261128]
    paths: ['.github/workflows/applicability-semantic-crosscheck.yml']
permissions:
  contents: read
  actions: read
jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: frozen-data
          path: research/applicability_transfer/data
          run-id: 46103184004
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: proposals-1
          path: research/applicability_transfer/work
          run-id: 46103184004
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: strategies
          path: research/applicability_transfer/work
          run-id: 46103184004
          github-token: ${{ github.token }}
      - name: Native semantic checks with parent and author controls
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python research/applicability_transfer/semantic_crosscheck.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-crosscheck
          path: research/applicability_transfer/semantic-crosscheck.zip
          if-no-files-found: error
          retention-days: 90
