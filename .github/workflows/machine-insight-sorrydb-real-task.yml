name: Machine Insight SorryDB Real Task Reproduction

on:
  push:
    branches:
      - machine-insight-sorrydb-ci
    paths:
      - '.github/workflows/machine-insight-sorrydb-real-task.yml'
      - 'machine_insight_real_task_trigger.txt'

permissions:
  contents: read

jobs:
  reproduce-real-task:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout harness branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install elan
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Clone pinned official SorryDB
        run: |
          set -euxo pipefail
          git clone https://github.com/SorryDB/SorryDB.git /tmp/SorryDB
          cd /tmp/SorryDB
          git checkout 83bd1976b2c0891dfd6dc997cd61956df7005a7f
          test "$(git rev-parse HEAD)" = "83bd1976b2c0891dfd6dc997cd61956df7005a7f"

      - name: Make unshipped Aristotle dependency installable without changing verifier code
        working-directory: /tmp/SorryDB
        run: |
          set -euxo pipefail
          python - <<'PY'
          import base64, csv, hashlib, io, zipfile
          from pathlib import Path
          out = Path('aristotlelib-0.7.0-py3-none-any.whl')
          files = {
              'aristotlelib/__init__.py': b'__version__ = "0.7.0"\n',
              'aristotlelib-0.7.0.dist-info/METADATA': b'Metadata-Version: 2.1\nName: aristotlelib\nVersion: 0.7.0\nSummary: CI stub for unused optional SorryDB verifier dependency\n',
              'aristotlelib-0.7.0.dist-info/WHEEL': b'Wheel-Version: 1.0\nGenerator: machine-insight-phase0\nRoot-Is-Purelib: true\nTag: py3-none-any\n',
          }
          rows=[]
          for name,data in files.items():
              digest=base64.urlsafe_b64encode(hashlib.sha256(data).digest()).rstrip(b'=').decode()
              rows.append((name, f'sha256={digest}', str(len(data))))
          rec='aristotlelib-0.7.0.dist-info/RECORD'
          buf=io.StringIO(newline=''); w=csv.writer(buf, lineterminator='\n')
          for row in rows: w.writerow(row)
          w.writerow((rec,'','')); files[rec]=buf.getvalue().encode()
          with zipfile.ZipFile(out,'w') as z:
              for name,data in sorted(files.items()):
                  zi=zipfile.ZipInfo(name, date_time=(1980,1,1,0,0,0)); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o644 << 16
                  z.writestr(zi,data)
          PY
          STUB_HASH="$(sha256sum aristotlelib-0.7.0-py3-none-any.whl | cut -d' ' -f1)"
          sed -i "s/sha256:cc8b6dccd5a4946bf69d7b72e0985f935370dd3a3d4dadcc61544ecb314cfe36/sha256:${STUB_HASH}/" poetry.lock
          printf 'stub_sha256=%s\n' "$STUB_HASH" > "$GITHUB_WORKSPACE/real_task_dependency_override.txt"

      - name: Install SorryDB
        working-directory: /tmp/SorryDB
        run: poetry install --no-interaction

      - name: Reproduce real SorryDB 2601 task in original project
        working-directory: /tmp/SorryDB
        run: |
          set -o pipefail
          poetry run python - <<'PY' 2>&1 | tee "$GITHUB_WORKSPACE/real_task_reproduction.log"
          import json, shutil, subprocess, traceback
          from collections import Counter, defaultdict
          from pathlib import Path

          from sorrydb.runners.json_runner import load_sorry_json
          from sorrydb.utils.git_ops import prepare_repository
          from sorrydb.database.process_sorries import build_lean_project
          from sorrydb.utils.verify import verify_proof

          dataset = Path('data/SorryDB_2601/SorryDB_2601_1000_evaluation_split.json')
          sorries = load_sorry_json(dataset)
          print('evaluation_tasks', len(sorries))

          groups = defaultdict(list)
          for s in sorries:
              groups[(s.repo.remote, s.repo.commit, s.repo.branch, s.repo.lean_version)].append(s)
          ordered = sorted(groups.items(), key=lambda kv: (-len(kv[1]), kv[0][0], kv[0][1]))
          print('distinct_repo_commits', len(ordered))
          print('top_groups', [(k[0], k[1], len(v)) for k,v in ordered[:10]])

          # Predeclared before inspecting outcomes; no hidden solutions or LLM calls.
          proofs = [
              'rfl',
              'simp',
              'norm_num',
              'by rfl',
              'by simp',
              'by norm_num',
              'by aesop',
          ]
          invalid_proof = 'by exact False.elim (by trivial)'
          lean_root = Path('/tmp/real_sorrydb_projects')
          lean_root.mkdir(parents=True, exist_ok=True)
          attempts=[]
          success=None

          # Try high-density repo/commit groups first only for this infrastructure reproduction gate.
          # These tasks are NOT used to form the later frozen comparative benchmark.
          for group_rank, (key, tasks) in enumerate(ordered[:8], start=1):
              remote, commit, branch, lean_version = key
              print(f'GROUP {group_rank}: {remote} {commit} tasks={len(tasks)} lean={lean_version}')
              try:
                  checkout = prepare_repository(remote, branch, commit, lean_root, lean_version)
                  print('checkout', checkout)
                  print('checkout_head', subprocess.check_output(['git','rev-parse','HEAD'], cwd=checkout, text=True).strip())
                  build_lean_project(checkout)
                  print('build_ok', remote, commit)
              except Exception as e:
                  print('GROUP_INFRA_ERROR', remote, commit, type(e).__name__, str(e))
                  traceback.print_exc()
                  continue

              for task in sorted(tasks, key=lambda x: x.id)[:16]:
                  print('TASK', task.id, task.location.path, task.location.start_line, task.debug_info.goal[:300].replace('\n',' | '))
                  for proof in proofs:
                      try:
                          ok, feedback = verify_proof(
                              checkout,
                              task.repo.lean_version,
                              task.location,
                              proof,
                              use_lean_interact=True,
                          )
                      except Exception as e:
                          ok=False; feedback=f'EXCEPTION {type(e).__name__}: {e}'
                      attempts.append({'task_id': task.id, 'proof': proof, 'verified': bool(ok), 'feedback': feedback[:2000]})
                      print('TRY', task.id, repr(proof), 'VERIFIED' if ok else 'FAILED')
                      if ok:
                          # Same exact official target, deliberate invalid replacement must be rejected.
                          try:
                              bad_ok, bad_feedback = verify_proof(
                                  checkout,
                                  task.repo.lean_version,
                                  task.location,
                                  invalid_proof,
                                  use_lean_interact=True,
                              )
                          except Exception as e:
                              bad_ok=False; bad_feedback=f'EXCEPTION {type(e).__name__}: {e}'
                          print('NEGATIVE_CONTROL', task.id, 'INCORRECTLY_VERIFIED' if bad_ok else 'REJECTED')
                          success = {
                              'task_id': task.id,
                              'project': remote,
                              'branch': branch,
                              'project_commit': commit,
                              'lean_version_recorded': lean_version,
                              'source_path': str(task.location.path),
                              'start_line': task.location.start_line,
                              'start_column': task.location.start_column,
                              'goal': task.debug_info.goal,
                              'accepted_proof': proof,
                              'accepted_verified': True,
                              'invalid_proof': invalid_proof,
                              'invalid_verified': bool(bad_ok),
                              'invalid_feedback': bad_feedback[:4000],
                              'sorrydb_commit': '83bd1976b2c0891dfd6dc997cd61956df7005a7f',
                              'dataset': str(dataset),
                          }
                          break
                  if success: break
              if success: break

          result = {'status': 'VERIFIED' if success and not success['invalid_verified'] else 'INFRA_ERROR', 'success': success, 'attempts': attempts}
          Path('/home/runner/work/mathgraph-fork/mathgraph-fork/real_task_result.json').write_text(json.dumps(result, indent=2, sort_keys=True))
          if not success:
              raise SystemExit('No deterministic proof found in bounded reproduction scan')
          if success['invalid_verified']:
              raise SystemExit('Negative control unexpectedly verified')
          print('REAL_TASK_PHASE0_VERIFIED', json.dumps(success, sort_keys=True))
          PY

      - name: Record exact environment
        if: always()
        working-directory: /tmp/SorryDB
        run: |
          {
            echo "sorrydb_commit=$(git rev-parse HEAD)"
            elan --version || true
            python --version || true
            poetry --version || true
          } | tee "$GITHUB_WORKSPACE/real_task_environment.txt"

      - name: Upload real-task reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-insight-sorrydb-real-task
          path: |
            real_task_result.json
            real_task_reproduction.log
            real_task_environment.txt
            real_task_dependency_override.txt
          if-no-files-found: warn
