name: Checkpoint 3 protected four-arm evaluation

on:
  push:
    branches: [triskelion-runtime-cp1]
    paths:
      - .github/workflows/checkpoint3-protected-eval.yml
  workflow_run:
    workflows: ["Checkpoint 3 build acquisition capability"]
    types: [completed]
  workflow_dispatch:
    inputs:
      capability_run_id:
        description: "Completed Checkpoint 3 acquisition capability build workflow run ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
  PYTHONDONTWRITEBYTECODE: "1"
  CAPABILITY_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.event_name == 'workflow_dispatch' && inputs.capability_run_id || '31878373257' }}

jobs:
  evaluate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'triskelion-runtime-cp1')
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Confirm frozen provider binding
        run: test -n "$RIVER_API_KEY" || { echo 'RIVER_API_KEY is not bound to this repository'; exit 78; }

      - name: Download closed protected-evaluation inputs
        uses: actions/download-artifact@v4
        with:
          name: checkpoint3-protected-eval-inputs-v1
          path: inputs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CAPABILITY_RUN_ID }}

      - name: Download immutable capability build for downstream identity chain
        uses: actions/download-artifact@v4
        with:
          name: checkpoint3-capability-v1
          path: capability-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CAPABILITY_RUN_ID }}

      - name: Checkout pinned BugsInPy metadata and target harness
        run: |
          git init BugsInPy
          git -C BugsInPy remote add origin https://github.com/soarsmu/BugsInPy.git
          git -C BugsInPy fetch --depth=1 origin 11c5f1eea954a42132cfd06bf257766a7963e0fd
          git -C BugsInPy checkout --detach FETCH_HEAD
          test "$(git -C BugsInPy rev-parse HEAD)" = 11c5f1eea954a42132cfd06bf257766a7963e0fd

      - name: Unpack frozen Triskelion River provider runtime
        run: |
          mkdir -p triskelion_runtime/work
          unzip -q triskelion_runtime/TRISKELION_RUNTIME_CHECKPOINT_1_PRECOMMITTED.zip -d triskelion_runtime/work

      - name: Install River provider dependency
        run: python -m pip install "river-client"

      - name: Build historical Python target images once
        run: |
          cat > /tmp/Dockerfile.py36 <<'EOF'
          FROM python:3.6.15-buster
          RUN sed -i 's|deb.debian.org|archive.debian.org|g; s|security.debian.org|archive.debian.org|g; /buster-updates/d' /etc/apt/sources.list \
              && apt-get -o Acquire::Check-Valid-Until=false update \
              && apt-get install -y --no-install-recommends build-essential git libffi-dev libjpeg-dev libxml2-dev libxslt1-dev zlib1g-dev \
              && rm -rf /var/lib/apt/lists/*
          EOF
          cat > /tmp/Dockerfile.py37 <<'EOF'
          FROM python:3.7.17-buster
          RUN sed -i 's|deb.debian.org|archive.debian.org|g; s|security.debian.org|archive.debian.org|g; /buster-updates/d' /etc/apt/sources.list \
              && apt-get -o Acquire::Check-Valid-Until=false update \
              && apt-get install -y --no-install-recommends build-essential git libffi-dev libjpeg-dev libxml2-dev libxslt1-dev zlib1g-dev \
              && rm -rf /var/lib/apt/lists/*
          EOF
          cat > /tmp/Dockerfile.py38 <<'EOF'
          FROM python:3.8.20-bullseye
          RUN apt-get update \
              && apt-get install -y --no-install-recommends build-essential git libffi-dev libjpeg-dev libxml2-dev libxslt1-dev zlib1g-dev \
              && rm -rf /var/lib/apt/lists/*
          EOF
          docker build -q -t cp3-python36 -f /tmp/Dockerfile.py36 /tmp
          docker build -q -t cp3-python37 -f /tmp/Dockerfile.py37 /tmp
          docker build -q -t cp3-python38 -f /tmp/Dockerfile.py38 /tmp

      - name: Run frozen four-arm protected evaluation
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/triskelion_runtime/work
        run: |
          python triskelion_runtime/checkpoint3_run_protected_eval.py \
            --causal-corpus inputs/CHECKPOINT3_CAUSAL_CORPUS_V1.json \
            --protected-tests inputs/protected-tests \
            --capability inputs/capability/CAPABILITY.json \
            --raw-memory inputs/capability/RAW_MEMORY.json \
            --bugsinpy BugsInPy \
            --out checkpoint3-protected-eval-v1

      - name: Enforce complete frozen result matrix
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('checkpoint3-protected-eval-v1/RESULTS.json').read_text())
          expected = result['protected_case_count'] * 4
          if result['row_count'] != expected:
              raise SystemExit(f"incomplete result matrix: {result['row_count']} != {expected}")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload complete protected evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint3-protected-eval-v1
          path: checkpoint3-protected-eval-v1
          if-no-files-found: warn
          retention-days: 90

      - name: Upload handoff-compatible protected evidence alias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp3-pipeline-protected-eval
          path: checkpoint3-protected-eval-v1
          if-no-files-found: warn
          retention-days: 90

      - name: Upload handoff-compatible capability evidence alias
        uses: actions/upload-artifact@v4
        with:
          name: cp3-pipeline-capability
          path: capability-build
          retention-days: 90
