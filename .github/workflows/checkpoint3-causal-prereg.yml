name: Checkpoint 3 causal preregistration

on:
  workflow_dispatch:
  push:
    branches: [triskelion-runtime-cp1]
    paths:
      - .github/workflows/checkpoint3-causal-prereg.yml
      - triskelion_runtime/CHECKPOINT3_CAUSAL_PROTOCOL_V1.json
      - triskelion_runtime/checkpoint3_causal_protocol.py
      - triskelion_runtime/checkpoint3_freeze_causal_corpus.py
      - triskelion_runtime/checkpoint3_causal_results.py
      - tests/test_checkpoint3_causal_protocol.py
      - tests/test_checkpoint3_freeze_causal_corpus.py
      - tests/test_checkpoint3_causal_results.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install -r requirements.txt
      - name: Validate frozen protocol, corpus and result boundaries
        run: |
          python -m pytest -q \
            tests/test_checkpoint3_causal_protocol.py \
            tests/test_checkpoint3_freeze_causal_corpus.py \
            tests/test_checkpoint3_causal_results.py
