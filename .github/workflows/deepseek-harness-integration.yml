name: Triskelion DeepSeek Harness integration

on:
  workflow_dispatch:
  push:
    branches:
      - triskelion-runtime-cp1
    paths:
      - 'integrations/deepseek-harness/**'
      - 'tests/test_deepseek_harness_bridge.py'
      - 'triskelion_runtime/checkpoint3_capability.py'
      - 'triskelion_runtime/checkpoint3_eval_core.py'
      - '.github/workflows/deepseek-harness-integration.yml'

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Test lifecycle, content identity, routing and ablation
        run: pytest -q tests/test_deepseek_harness_bridge.py tests/test_checkpoint3_eval_core.py
      - name: Exercise full acceptance runner on non-scientific smoke capability
        env:
          TRISKELION_REPO_ROOT: ${{ github.workspace }}
        run: |
          python integrations/deepseek-harness/accept_capability.py \
            integrations/deepseek-harness/SMOKE_CAPABILITY.json \
            --visible-context 'triskelion-smoke-trigger'

  harness-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm through Corepack
        run: corepack enable
      - name: Checkout pinned DeepSeek Harness
        run: |
          git clone --quiet https://github.com/deepseek-ai/deepseek-harness.git /tmp/deepseek-harness
          git -C /tmp/deepseek-harness checkout --quiet --detach 47f943859bef60e4160492346772ded9b24f765a
      - name: Install and build pinned Harness
        working-directory: /tmp/deepseek-harness
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Load Triskelion plugin against native Harness packages
        run: |
          mkdir -p /tmp/deepseek-harness/scratch-plugin/triskelion
          cp integrations/deepseek-harness/triskelion-plugin.ts /tmp/deepseek-harness/scratch-plugin/triskelion/triskelion-plugin.ts
          cd /tmp/deepseek-harness
          pnpm exec tsx -e "import('./scratch-plugin/triskelion/triskelion-plugin.ts').then(m => { if (m.name !== 'triskelion-runtime' || typeof m.apply !== 'function') process.exit(2); console.log('Triskelion Harness plugin import: PASS') })"
