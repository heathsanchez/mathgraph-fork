name: Machine Insight SorryDB Phase 0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase0:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout harness branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install elan
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan --version

      - name: Clone pinned official SorryDB
        run: |
          set -euxo pipefail
          git clone https://github.com/SorryDB/SorryDB.git /tmp/SorryDB
          cd /tmp/SorryDB
          git checkout 83bd1976b2c0891dfd6dc997cd61956df7005a7f
          test "$(git rev-parse HEAD)" = "83bd1976b2c0891dfd6dc997cd61956df7005a7f"
          git status --short

      - name: Reconstruct unavailable optional Aristotle wheel
        working-directory: /tmp/SorryDB
        run: |
          set -euxo pipefail
          python - <<'PY'
          import base64, csv, hashlib, io, zipfile
          from pathlib import Path
          out = Path('aristotlelib-0.7.0-py3-none-any.whl')
          files = {
              'aristotlelib/__init__.py': b'__version__ = "0.7.0"\n',
              'aristotlelib-0.7.0.dist-info/METADATA': b'Metadata-Version: 2.1\nName: aristotlelib\nVersion: 0.7.0\nSummary: CI stub for unused optional SorryDB verifier dependency\n',
              'aristotlelib-0.7.0.dist-info/WHEEL': b'Wheel-Version: 1.0\nGenerator: machine-insight-phase0\nRoot-Is-Purelib: true\nTag: py3-none-any\n',
          }
          records=[]
          for name,data in files.items():
              digest=base64.urlsafe_b64encode(hashlib.sha256(data).digest()).rstrip(b'=').decode()
              records.append((name, f'sha256={digest}', str(len(data))))
          record_name='aristotlelib-0.7.0.dist-info/RECORD'
          buf=io.StringIO(newline='')
          w=csv.writer(buf, lineterminator='\n')
          for row in records: w.writerow(row)
          w.writerow((record_name,'',''))
          files[record_name]=buf.getvalue().encode()
          with zipfile.ZipFile(out,'w') as z:
              for name,data in sorted(files.items()):
                  zi=zipfile.ZipInfo(name, date_time=(1980,1,1,0,0,0))
                  zi.compress_type=zipfile.ZIP_DEFLATED
                  zi.external_attr=0o644 << 16
                  z.writestr(zi,data)
          PY
          STUB_HASH="$(sha256sum aristotlelib-0.7.0-py3-none-any.whl | cut -d' ' -f1)"
          echo "stub_sha256=${STUB_HASH}" | tee "$GITHUB_WORKSPACE/aristotle_ci_override.txt"
          sed -i "s/sha256:cc8b6dccd5a4946bf69d7b72e0985f935370dd3a3d4dadcc61544ecb314cfe36/sha256:${STUB_HASH}/" poetry.lock
          grep -A12 -B2 'name = "aristotlelib"' poetry.lock | tee -a "$GITHUB_WORKSPACE/aristotle_ci_override.txt"

      - name: Record environment before install
        run: |
          {
            uname -a
            python --version
            poetry --version
            git --version
            elan --version
          } | tee phase0_environment.txt

      - name: Install SorryDB dependencies
        working-directory: /tmp/SorryDB
        run: poetry install --no-interaction

      - name: Run official verifier positive and negative tests
        working-directory: /tmp/SorryDB
        run: |
          set -o pipefail
          poetry run pytest tests/test_verify.py -vv 2>&1 | tee "$GITHUB_WORKSPACE/phase0_verifier_test.log"

      - name: Record resolved Lean/Lake versions
        if: always()
        working-directory: /tmp/SorryDB
        run: |
          {
            echo "sorrydb_commit=$(git rev-parse HEAD)"
            echo "official_tree_modified_for_ci=$(git status --short -- poetry.lock aristotlelib-0.7.0-py3-none-any.whl | tr '\n' ';')"
            echo "mock_lean_toolchain=$(cat tests/mock_lean_repository/lean-toolchain)"
            elan --version || true
            (cd tests/mock_lean_repository && lean --version) || true
            (cd tests/mock_lean_repository && lake --version) || true
          } | tee -a "$GITHUB_WORKSPACE/phase0_environment.txt"

      - name: Upload Phase 0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-insight-sorrydb-phase0
          path: |
            phase0_environment.txt
            phase0_verifier_test.log
            aristotle_ci_override.txt
          if-no-files-found: warn
