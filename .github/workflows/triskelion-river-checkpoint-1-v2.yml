name: Triskelion River Checkpoint 1 V2

on:
  push:
    branches:
      - triskelion-runtime-cp1
    paths:
      - triskelion_runtime/river_checkpoint_1_v2_run.py
      - triskelion_runtime/RIVER_CHECKPOINT_1_V2_PROTOCOL.md
      - .github/workflows/triskelion-river-checkpoint-1-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-four-arm-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm secret binding
        run: test -n "$RIVER_API_KEY" || { echo 'RIVER_API_KEY is not bound'; exit 78; }
      - name: Unpack frozen V1 substrate
        run: |
          mkdir -p triskelion_runtime/work/experiments/river_checkpoint_1_v2
          unzip -q triskelion_runtime/TRISKELION_RUNTIME_CHECKPOINT_1_PRECOMMITTED.zip -d triskelion_runtime/work
          mkdir -p triskelion_runtime/work/experiments/river_checkpoint_1_v2
          cp triskelion_runtime/river_checkpoint_1_v2_run.py triskelion_runtime/work/experiments/river_checkpoint_1_v2/run.py
          cp triskelion_runtime/RIVER_CHECKPOINT_1_V2_PROTOCOL.md triskelion_runtime/work/experiments/river_checkpoint_1_v2/PROTOCOL.md
      - name: Install frozen dependency
        run: pip install "river-client"
      - name: Runtime and V2 parser tests
        working-directory: triskelion_runtime/work
        run: |
          python -B -m unittest discover -s tests -v
          python -B experiments/river_checkpoint_1_v2/run.py --self-test
      - name: Run frozen River V2 protocol
        working-directory: triskelion_runtime/work
        run: python -B experiments/river_checkpoint_1_v2/run.py --out river_checkpoint_1_v2_result
      - name: Upload complete V2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TRISKELION_RIVER_CHECKPOINT_1_V2_RESULT
          path: triskelion_runtime/work/river_checkpoint_1_v2_result/
          if-no-files-found: warn
