name: Prospective retained-method Funcy transfer
on:
  push:
    branches: [research/retained-method-funcy-20261129]
    paths: [.github/workflows/retained-method-funcy.yml]
permissions:
  contents: read
concurrency:
  group: retained-method-funcy-20261129
  cancel-in-progress: false
jobs:
  prospective-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Test source, patch, isolation and authority guards
        run: python -m unittest discover -s research/retained_method -p test_guards.py -v
      - name: Authenticate exact source and independent native authority before inference
        run: python research/retained_method/pipeline.py prepare
      - name: Install existing model transport
        run: python -m pip install openai==2.9.0
      - name: Nine isolated budgeted trajectories and write-once response seal
        run: python research/retained_method/pipeline.py learn
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Hidden common qualification and source withdrawal restoration
        run: python research/retained_method/pipeline.py qualify
      - name: Fresh-directory exact-source replay without inference
        run: python research/retained_method/pipeline.py replay
      - name: Preserve every outcome including failure
        if: always()
        run: python research/retained_method/pipeline.py bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-method-funcy-evidence
          path: research/retained_method/evidence.zip
          retention-days: 90
          if-no-files-found: error
