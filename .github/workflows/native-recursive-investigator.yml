        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: receipt-2
          path: research/native_recursive_investigator/stage/prior
      - run: python -m pip install 'openai==2.9.0'
      - name: Invent an improved investigation method from past native evidence only
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python research/native_recursive_investigator/loop.py learn 2
      - uses: actions/upload-artifact@v4
        with:
          name: method-raw-2
          path: research/native_recursive_investigator/stage/method_raw.json
          if-no-files-found: error
          retention-days: 30

  qualify_method_2:
    needs: learn_2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
