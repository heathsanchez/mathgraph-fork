          path: research/native_recursive_investigator/stage/prior
      - uses: actions/download-artifact@v4
        with:
          name: method-1
          path: research/native_recursive_investigator/stage/method
      - run: python -m pip install 'openai==2.9.0'
      - name: Model proposes bounded repairs, no code execution
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python research/native_recursive_investigator/loop.py propose 2
      - uses: actions/upload-artifact@v4
