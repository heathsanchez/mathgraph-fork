name: Checkpoint 3 frozen end-to-end pipeline

# The original monolithic run is intentionally superseded by the immutable staged chain:
# pandas rescue -> finalize qualification -> build acquisition capability -> protected evaluation.
# Keeping this workflow as a tiny tombstone causes its concurrency group to cancel the old
# waiter without launching a second scientific evaluation.
on:
  push:
    branches: [triskelion-runtime-cp1]
    paths:
      - .github/workflows/checkpoint3-frozen-pipeline.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkpoint3-frozen-end-to-end
  cancel-in-progress: true

jobs:
  superseded:
    runs-on: ubuntu-22.04
    steps:
      - name: Record staged continuation
        run: |
          echo 'Monolithic CP3 pipeline superseded.'
          echo 'Authoritative continuation: pandas rescue -> finalizer -> capability build -> protected evaluation.'
          echo 'No model calls or protected-set accesses occur in this tombstone workflow.'
