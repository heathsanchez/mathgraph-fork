name: Gap-conditional structural Cell LLM experiment

on:
  push:
    branches:
      - research/gap-conditional-cell-20261117
    paths:
      - .github/workflows/gap-conditional-cell.yml

permissions:
  contents: read

concurrency:
  group: gap-conditional-cell-20261117
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent structural preflight and syntax
        run: |
          python -m py_compile research/gap_conditional_cell/structural.py research/gap_conditional_cell/run.py research/gap_conditional_cell/score.py
          python research/gap_conditional_cell/structural.py
      - name: Install pinned OpenAI SDK
        run: python -m pip install --quiet 'openai==2.9.0'
      - name: Propose one-shot bridge only at structurally established gaps
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python research/gap_conditional_cell/run.py
      - name: Preserve model proposals, usage, gate outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gap-conditional-raw-proposals
          path: research/gap_conditional_cell/proposals.json
          retention-days: 30
          if-no-files-found: warn

  verify:
    if: always()
    needs: propose
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: gap-conditional-raw-proposals
          path: research/gap_conditional_cell
      - name: Independently score without API secrets or generated-code execution
        run: |
          python research/gap_conditional_cell/structural.py
          python research/gap_conditional_cell/score.py
      - name: Preserve source, proposals, and scored receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gap-conditional-scored
          path: |
            research/gap_conditional_cell/cases.json
            research/gap_conditional_cell/proposals.json
            research/gap_conditional_cell/summary.json
          retention-days: 30
          if-no-files-found: warn
